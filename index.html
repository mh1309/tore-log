<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#b8391f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレログ">
<title>トレログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<style>
  :root {
    --bg: #eceae3;
    --surface: #ffffff;
    --surface-2: #e2dfd4;
    --surface-3: #d3cfc0;
    --text: #1d1c19;
    --text-secondary: #6a655a;
    --text-tertiary: #94907f;
    --accent: #b8391f;
    --accent-strong: #96301a;
    --accent-ink: #fff8f3;
    --accent-wash: rgba(184, 57, 31, 0.1);
    --accent-wash-2: rgba(184, 57, 31, 0.32);
    --accent2: #3d6d82;
    --accent2-ink: #f2f8fa;
    --cal-select: #5c5648;
    --cal-select-ink: #f7f5ef;
    --border: #d7d3c5;
    --danger: #a52f2f;
    --danger-ink: #fff8f3;
    --shadow: 0 1px 2px rgba(29,28,25,0.07), 0 6px 16px rgba(29,28,25,0.07);
    --font-display: 'Oswald', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-body: 'Work Sans', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Hiragino Sans', 'Yu Gothic', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201d18;
      --surface: #2a2621;
      --surface-2: #34302a;
      --surface-3: #423c33;
      --text: #f1ece1;
      --text-secondary: #b7ac99;
      --text-tertiary: #8c8271;
      --accent: #e2724a;
      --accent-strong: #f0885a;
      --accent-ink: #201d18;
      --accent-wash: rgba(226, 114, 74, 0.16);
      --accent-wash-2: rgba(226, 114, 74, 0.38);
      --accent2: #74a8bd;
      --accent2-ink: #14212a;
      --cal-select: #a89a80;
      --cal-select-ink: #23201a;
      --border: #423c33;
      --danger: #d9645f;
      --danger-ink: #201d18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #201d18;
    --surface: #2a2621;
    --surface-2: #34302a;
    --surface-3: #423c33;
    --text: #f1ece1;
    --text-secondary: #b7ac99;
    --text-tertiary: #8c8271;
    --accent: #e2724a;
    --accent-strong: #f0885a;
    --accent-ink: #201d18;
    --accent-wash: rgba(226, 114, 74, 0.16);
    --accent-wash-2: rgba(226, 114, 74, 0.38);
    --accent2: #74a8bd;
    --accent2-ink: #14212a;
    --border: #423c33;
    --danger: #d9645f;
    --danger-ink: #201d18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }

  button, input { font-family: inherit; color: inherit; }
  button { -webkit-appearance: none; appearance: none; border: none; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent2);
    outline-offset: 2px;
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .stopwatch-widget { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .stopwatch-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: var(--shadow);
  }
  .stopwatch-chip.is-running { border-color: var(--accent); }
  .stopwatch-icon { font-size: 0.7rem; color: var(--accent); line-height: 1; }
  .stopwatch-time {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.92rem;
    font-weight: 600;
  }
  .stopwatch-reset-btn {
    width: 34px; height: 34px;
    border-radius: 999px;
    color: var(--text-tertiary);
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .stopwatch-reset-btn:active { background: var(--surface-2); }
  .brand-mark {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .brand-mark .dot { color: var(--accent); }
  .brand-sub {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
  }

  /* ---------- main / view ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
  }

  section { display: flex; flex-direction: column; gap: 10px; }

  h2.section-title {
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin: 0;
  }

  /* ---------- date nav ---------- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 6px;
    box-shadow: var(--shadow);
  }
  .date-nav-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-size: 1.1rem;
    color: var(--text-secondary);
  }
  .date-nav-btn:active { background: var(--surface-2); }
  .date-nav-btn:disabled { opacity: 0.3; }
  .date-label {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
  }
  .date-label .today-flag {
    margin-left: 6px;
    font-size: 0.65rem;
    font-family: var(--font-display);
    letter-spacing: 0.08em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 6px;
    vertical-align: middle;
  }

  /* ---------- exercise chips ---------- */
  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.86rem;
    font-weight: 500;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .chip.is-selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .chip.chip-add {
    color: var(--accent2);
    border-color: var(--accent2);
    background: transparent;
  }

  /* ---------- entry card ---------- */
  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .entry-card-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .stepper-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stepper-label {
    width: 42px;
    font-size: 0.78rem;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .stepper-btn {
    width: 44px; height: 44px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .stepper-btn:active { background: var(--surface-3); }
  .stepper-input-wrap {
    flex: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 6px 4px;
  }
  .stepper-input {
    width: 100%;
    max-width: 110px;
    border: none;
    background: transparent;
    text-align: center;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text);
    padding: 4px 0;
  }
  .stepper-unit { font-size: 0.8rem; color: var(--text-tertiary); }

  .memo-row { display: flex; }
  .memo-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: var(--text);
    font-family: var(--font-body);
  }
  .memo-input::placeholder { color: var(--text-tertiary); }

  .e1rm-preview {
    font-size: 0.78rem;
    color: var(--text-tertiary);
    text-align: center;
  }
  .e1rm-preview b { color: var(--text-secondary); font-family: var(--font-mono); font-weight: 600; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
    transform: scale(1);
    transition: transform 0.09s ease, background 0.09s ease;
  }
  .btn-primary:active { background: var(--accent-strong); transform: scale(0.96); }
  .btn-primary.btn-flash { animation: btn-log-pulse 0.36s ease; }
  @keyframes btn-log-pulse {
    0% { transform: scale(1); background: var(--accent); }
    30% { transform: scale(0.93); background: var(--accent-strong); }
    65% { transform: scale(1.045); background: var(--accent-strong); }
    100% { transform: scale(1); background: var(--accent); }
  }

  .btn-secondary {
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }
  .btn-secondary:active { background: var(--surface-3); }

  .btn-text {
    color: var(--accent2);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 2px;
  }

  .btn-danger {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: var(--danger);
    color: var(--danger-ink);
    font-weight: 600;
    font-size: 0.9rem;
  }

  /* ---------- set list ---------- */
  .set-list { display: flex; flex-direction: column; gap: 6px; }
  .set-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .set-row-main { display: flex; align-items: center; gap: 10px; }
  .set-row-memo {
    font-size: 0.76rem;
    color: var(--text-tertiary);
    padding-left: 28px;
    line-height: 1.4;
    word-break: break-word;
  }
  .set-row-idx {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-tertiary);
    width: 18px;
  }
  .set-row-figure {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.98rem;
    font-weight: 600;
    flex: 1;
  }
  .set-row-figure .x { color: var(--text-tertiary); font-weight: 500; margin: 0 3px; }
  .set-row-e1rm {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
  }
  .set-row-del {
    width: 34px; height: 34px;
    border-radius: 8px;
    color: var(--text-tertiary);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .set-row-del:active { background: var(--surface-2); color: var(--danger); }

  /* ---------- rest timer ---------- */
  .rest-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .rest-card.is-complete { animation: restFlash 0.7s ease-in-out 3; }
  @keyframes restFlash {
    0%, 100% { background: var(--surface); }
    50% { background: var(--accent-wash); }
  }
  .rest-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rest-card-head-right { display: flex; align-items: center; gap: 8px; }
  .rest-status { font-size: 0.78rem; font-weight: 600; color: var(--accent); }
  .sound-toggle {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 0.72rem;
    font-weight: 600;
  }
  .sound-toggle.is-on { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .sound-toggle:active { background: var(--surface-2); }
  .rest-display { display: flex; justify-content: center; }
  .rest-countdown {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 2.6rem;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .rest-progress-track {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .rest-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.2s linear;
  }
  .rest-preset-row { padding: 0; }
  .rest-preset-row .chip { padding: 7px 14px; font-size: 0.8rem; }
  .rest-controls { display: flex; align-items: center; gap: 10px; }
  .rest-controls .btn-primary { flex: 1; }
  .rest-controls .stepper-btn { font-size: 0.85rem; font-weight: 600; }
  .rest-reset-btn { align-self: center; }

  .empty-state {
    text-align: center;
    padding: 28px 16px;
    color: var(--text-tertiary);
    font-size: 0.86rem;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 14px;
    line-height: 1.6;
  }

  /* ---------- history list ---------- */
  .day-group { display: flex; flex-direction: column; gap: 8px; }
  .day-group + .day-group { margin-top: 8px; }
  .day-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    font-weight: 600;
    font-size: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .day-summary .meta { font-weight: 400; color: var(--text-tertiary); font-size: 0.78rem; }
  .day-body { padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .part-group {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .part-summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 13px 14px;
    min-height: 24px;
  }
  .part-summary::-webkit-details-marker { display: none; }
  .part-summary .part-label {
    font-family: var(--font-display);
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent2);
  }
  .part-summary .chev {
    color: var(--text-tertiary);
    font-size: 0.85rem;
    transition: transform 0.15s ease;
  }
  .part-group[open] > .part-summary .chev { transform: rotate(90deg); }
  .part-body { display: flex; flex-direction: column; gap: 12px; padding: 0 14px 14px; }
  .part-group-plain .part-body { padding-top: 14px; }
  .day-exercise-block { display: flex; flex-direction: column; gap: 6px; }
  .day-exercise-name { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); }
  .day-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-set-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 5px 6px 5px 10px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .day-set-chip button {
    width: 24px; height: 24px;
    color: var(--text-tertiary);
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .day-memo-list { display: flex; flex-direction: column; gap: 2px; }
  .day-memo-item {
    font-size: 0.76rem;
    color: var(--text-tertiary);
    line-height: 1.4;
    word-break: break-word;
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(84px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow);
    z-index: 30;
    animation: toastPop 0.25s ease;
    white-space: nowrap;
  }
  @keyframes toastPop {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ---------- last-set hint ---------- */
  .last-set-hint { font-size: 0.78rem; color: var(--text-tertiary); }
  .last-set-hint b { color: var(--text-secondary); font-family: var(--font-mono); font-weight: 600; }

  /* ---------- PR badge ---------- */
  .pr-badge {
    font-family: var(--font-display);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 5px;
    padding: 2px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ---------- part tag / filter / picker ---------- */
  .part-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--accent2);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .part-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .part-picker .chip { padding: 7px 13px; font-size: 0.8rem; }
  .filter-row .chip { padding: 7px 14px; font-size: 0.8rem; }

  /* ---------- calendar ---------- */
  .calendar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .calendar-head { display: flex; align-items: center; justify-content: space-between; }
  .calendar-month-label { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 3px; }
  .calendar-month-caret { font-size: 0.75rem; color: var(--text-tertiary); }
  .calendar-nav-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .calendar-nav-btn:active { background: var(--surface-2); }
  .calendar-weekdays, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .calendar-weekdays span {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-tertiary);
    font-weight: 600;
  }
  .calendar-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "iron-log:v1";

  var DEFAULT_EXERCISES = [
    { name: "ベンチプレス", part: "胸" },
    { name: "スクワット", part: "脚" },
    { name: "デッドリフト", part: "背中" },
    { name: "ショルダープレス", part: "肩" },
    { name: "懸垂", part: "背中" },
    { name: "バーベルロウ", part: "背中" }
  ];

  var PARTS = ["胸", "背中", "脚", "肩", "腕", "体幹"];
  var KG_TO_LB = 2.2046226218;

  var REST_PRESETS = [60, 90, 120, 180];

  function uid(prefix) {
    return prefix + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function addDays(dateStr, delta) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setDate(d.getDate() + delta);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  function formatDateLabel(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return (parts[1]) + "月" + parts[2] + "日（" + WEEKDAYS[d.getDay()] + "）";
  }

  function formatDateShort(dateStr) {
    var parts = dateStr.split("-").map(Number);
    return parts[1] + "/" + parts[2];
  }

  function e1rm(weight, reps) {
    if (reps <= 1) return weight;
    return weight * (1 + reps / 30);
  }

  function fmtWeight(w) {
    var n = Math.round(w * 100) / 100;
    if (n % 1 === 0) return n.toFixed(0);
    return n.toFixed(2).replace(/0$/, "").replace(/\.$/, "");
  }

  function fmtClock(totalSeconds) {
    var s = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ":" + pad2(sec);
  }

  function toDisplayWeight(kg) { return state.settings.unit === "lb" ? kg * KG_TO_LB : kg; }
  function toStorageWeight(disp) { return state.settings.unit === "lb" ? disp / KG_TO_LB : disp; }
  function unitLabel() { return state.settings.unit === "lb" ? "lb" : "kg"; }
  function dispW(kg) { return fmtWeight(toDisplayWeight(kg)); }
  function weightStepOptions() { return state.settings.unit === "lb" ? [2.5, 5, 10] : [1.25, 2.5, 5]; }

  function fmtStopwatch(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    return (h > 0 ? h + ":" + pad2(m) : pad2(m)) + ":" + pad2(s);
  }

  /* ---------------- timers: stopwatch (count-up) + rest timer (countdown) ---------------- */

  var tickHandle = null;
  var audioCtx = null;

  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      else if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* audio unavailable */ }
  }

  function playBeep() {
    if (!audioCtx) return;
    try {
      [0, 0.4].forEach(function (offset) {
        var t0 = audioCtx.currentTime + offset;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.3);
      });
    } catch (e) { /* ignore */ }
  }

  function ensureTicking() {
    if (tickHandle) return;
    tickHandle = setInterval(tick, 250);
  }

  function maybeStopTicking() {
    if (!ui.restTimer.running && !state.stopwatch.running && tickHandle) {
      clearInterval(tickHandle);
      tickHandle = null;
    }
  }

  function stopwatchElapsedMs() {
    var ms = state.stopwatch.accumulatedMs;
    if (state.stopwatch.running && state.stopwatch.startedAt) ms += (Date.now() - state.stopwatch.startedAt);
    return ms;
  }

  function updateStopwatchDisplay() {
    var timeEl = document.getElementById("stopwatch-time");
    var iconEl = document.getElementById("stopwatch-icon");
    var chipEl = document.getElementById("stopwatch-chip");
    if (!timeEl) return;
    timeEl.textContent = fmtStopwatch(stopwatchElapsedMs());
    if (iconEl) iconEl.textContent = state.stopwatch.running ? "❚❚" : "▶";
    if (chipEl) chipEl.classList.toggle("is-running", state.stopwatch.running);
  }

  function toggleStopwatch() {
    unlockAudio();
    if (state.stopwatch.running) {
      state.stopwatch.accumulatedMs = stopwatchElapsedMs();
      state.stopwatch.running = false;
      state.stopwatch.startedAt = null;
    } else {
      state.stopwatch.running = true;
      state.stopwatch.startedAt = Date.now();
      ensureTicking();
    }
    saveState();
    updateStopwatchDisplay();
    maybeStopTicking();
  }

  function resetStopwatch() {
    state.stopwatch = defaultStopwatch();
    saveState();
    updateStopwatchDisplay();
    maybeStopTicking();
  }

  function restPct() {
    var d = Math.max(ui.restTimer.duration, ui.restTimer.remaining, 1);
    return Math.max(0, Math.min(100, (ui.restTimer.remaining / d) * 100));
  }

  function updateRestTimerDisplay() {
    var countEl = document.getElementById("rest-countdown");
    if (!countEl) return;
    countEl.textContent = fmtClock(ui.restTimer.remaining);
    var fillEl = document.getElementById("rest-progress");
    if (fillEl) fillEl.style.width = restPct() + "%";
    var btnEl = document.getElementById("rest-toggle-btn");
    if (btnEl) btnEl.textContent = ui.restTimer.running ? "一時停止" : (ui.restTimer.remaining <= 0 ? "もう一度休憩する" : "開始");
  }

  function onRestTimerComplete() {
    if (state.settings.soundEnabled) playBeep();
    if (navigator.vibrate) { try { navigator.vibrate([200, 120, 200]); } catch (e) { /* ignore */ } }
  }

  function toggleSound() {
    state.settings.soundEnabled = !state.settings.soundEnabled;
    saveState();
    if (state.settings.soundEnabled) unlockAudio();
  }

  function startRestTimer(durationSec) {
    unlockAudio();
    if (typeof durationSec === "number") ui.restTimer.duration = durationSec;
    if (ui.restTimer.remaining <= 0) ui.restTimer.remaining = ui.restTimer.duration;
    ui.restTimer.endAt = Date.now() + ui.restTimer.remaining * 1000;
    ui.restTimer.running = true;
    ui.restTimer.completed = false;
    ensureTicking();
  }

  function pauseRestTimer() {
    if (ui.restTimer.running) {
      ui.restTimer.remaining = Math.max(0, (ui.restTimer.endAt - Date.now()) / 1000);
      ui.restTimer.running = false;
    }
    maybeStopTicking();
  }

  function resetRestTimer() {
    ui.restTimer.running = false;
    ui.restTimer.completed = false;
    ui.restTimer.remaining = ui.restTimer.duration;
    ui.restTimer.endAt = null;
    maybeStopTicking();
  }

  function setRestPreset(sec) {
    ui.restTimer.duration = sec;
    ui.restTimer.remaining = sec;
    ui.restTimer.completed = false;
    if (ui.restTimer.running) {
      ui.restTimer.endAt = Date.now() + sec * 1000;
    } else {
      ui.restTimer.endAt = null;
    }
  }

  function adjustRestTimer(deltaSec) {
    ui.restTimer.completed = false;
    if (ui.restTimer.running) {
      ui.restTimer.endAt += deltaSec * 1000;
      ui.restTimer.remaining = Math.max(0, (ui.restTimer.endAt - Date.now()) / 1000);
    } else {
      ui.restTimer.remaining = Math.max(0, ui.restTimer.remaining + deltaSec);
    }
    ui.restTimer.duration = Math.max(ui.restTimer.duration, ui.restTimer.remaining, 5);
  }

  function tick() {
    if (state.stopwatch.running) updateStopwatchDisplay();
    if (ui.restTimer.running) {
      var rem = (ui.restTimer.endAt - Date.now()) / 1000;
      if (rem <= 0) {
        ui.restTimer.remaining = 0;
        ui.restTimer.running = false;
        ui.restTimer.completed = true;
        onRestTimerComplete();
        render();
      } else {
        ui.restTimer.remaining = rem;
        updateRestTimerDisplay();
      }
    }
    maybeStopTicking();
  }

  function defaultStopwatch() { return { running: false, startedAt: null, accumulatedMs: 0 }; }
  function defaultSettings() { return { soundEnabled: false, unit: "kg", weightStep: 2.5 }; }

  function defaultState() {
    var exercises = DEFAULT_EXERCISES.map(function (d) {
      return { id: uid("ex"), name: d.name, part: d.part, addedAt: Date.now() };
    });
    return { exercises: exercises, sets: [], stopwatch: defaultStopwatch(), settings: defaultSettings(), parts: PARTS.slice() };
  }

  function migrateState(parsed) {
    if (!parsed.stopwatch) parsed.stopwatch = defaultStopwatch();
    if (!parsed.settings) parsed.settings = defaultSettings();
    if (typeof parsed.settings.unit !== "string") parsed.settings.unit = "kg";
    if (typeof parsed.settings.weightStep !== "number") parsed.settings.weightStep = 2.5;
    if (typeof parsed.settings.soundEnabled !== "boolean") parsed.settings.soundEnabled = false;
    if (!Array.isArray(parsed.parts)) parsed.parts = PARTS.slice();
    parsed.exercises.forEach(function (ex) { if (typeof ex.part !== "string") ex.part = ""; });
    return parsed;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.exercises) && Array.isArray(parsed.sets)) {
          return migrateState(parsed);
        }
      }
    } catch (e) { /* ignore, fall through to default */ }
    return defaultState();
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  var state = loadState();

  var ui = {
    tab: "log",
    selectedExerciseId: state.exercises[0] ? state.exercises[0].id : null,
    selectedDate: todayStr(),
    entryWeight: 20,
    entryReps: 10,
    entryMemo: "",
    logFlash: false,
    exerciseDetailId: null,
    chartTooltipIndex: {},
    modal: null,
    modalPart: "",
    restTimer: { duration: 90, remaining: 90, running: false, completed: false, endAt: null },
    logFilterPart: null,
    calendarMonth: todayStr().slice(0, 7),
    calendarTapDate: todayStr(),
    calendarFilterActive: false,
    historyViewMode: "date",
    statsPeriod: "week",
    statsAnchor: todayStr(),
    toast: null
  };

  function primeEntryFromHistory(exId) {
    var mine = state.sets.filter(function (s) { return s.exerciseId === exId; });
    if (mine.length) {
      mine.sort(function (a, b) { return b.ts - a.ts; });
      ui.entryWeight = toDisplayWeight(mine[0].weight);
      ui.entryReps = mine[0].reps;
    } else {
      ui.entryWeight = state.settings.unit === "lb" ? 45 : 20;
      ui.entryReps = 10;
    }
    ui.entryMemo = "";
  }
  if (ui.selectedExerciseId) primeEntryFromHistory(ui.selectedExerciseId);

  function exerciseById(id) {
    for (var i = 0; i < state.exercises.length; i++) if (state.exercises[i].id === id) return state.exercises[i];
    return null;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var toastTimer = null;

  function renderToast() {
    var root = document.getElementById("toast-root");
    if (!root) return;
    root.innerHTML = ui.toast ? '<div class="toast">' + escapeHtml(ui.toast) + '</div>' : "";
  }

  function showToast(msg) {
    ui.toast = msg;
    renderToast();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; renderToast(); }, 2600);
  }

  /* ---------------- render: log tab ---------------- */

  function renderLogTab() {
    var html = "";

    html += '<section class="date-nav-section">';
    html += '<div class="date-nav">';
    html += '<button class="date-nav-btn" data-action="date-prev">‹</button>';

  /* ---------------- render: history tab ---------------- */

  function monthLabel(ym) {
    var parts = ym.split("-").map(Number);
    return parts[0] + "年" + parts[1] + "月";
  }

  function shiftMonth(ym, delta) {
    var parts = ym.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1 + delta, 1);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }

  function weekRange(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var start = addDays(dateStr, -d.getDay());
    var end = addDays(start, 6);
    return { start: start, end: end };
  }

  function monthRange(dateStr) {
    var ym = dateStr.slice(0, 7);
    var parts = ym.split("-").map(Number);
    var lastDay = new Date(parts[0], parts[1], 0).getDate();
    return { start: ym + "-01", end: ym + "-" + pad2(lastDay), ym: ym };
  }

  function computeStreak() {
    var daysWithSets = {};
    state.sets.forEach(function (s) { daysWithSets[s.date] = true; });
    var cursor = todayStr();
    if (!daysWithSets[cursor]) cursor = addDays(cursor, -1);
    var streak = 0;
    while (daysWithSets[cursor]) {
      streak++;
      cursor = addDays(cursor, -1);
    }
    return streak;
  }

  function partsForDate(dateStr) {
    var ids = {};
    state.sets.forEach(function (s) { if (s.date === dateStr) ids[s.exerciseId] = true; });
    var result = [];
    Object.keys(ids).forEach(function (exId) {
      var ex = exerciseById(exId);
      if (ex && ex.part && result.indexOf(ex.part) === -1) result.push(ex.part);
    });
    return result;
  }

  function renderCalendarCard() {
    var ym = ui.calendarMonth;
    var ymParts = ym.split("-").map(Number);
    var year = ymParts[0], month = ymParts[1];
    var firstDow = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var today = todayStr();

    var countByDate = {};
    state.sets.forEach(function (s) { countByDate[s.date] = (countByDate[s.date] || 0) + 1; });

    var html = '<div class="calendar-card">';
    html += '<div class="calendar-head"><button class="calendar-nav-btn" data-action="calendar-prev">‹</button>';
    html += '<button class="calendar-month-label" data-action="open-month-picker">' + monthLabel(ym) + ' <span class="calendar-month-caret">⌄</span></button>';
    html += '<button class="calendar-nav-btn" data-action="calendar-next">›</button></div>';
    html += '<div class="calendar-weekdays">';
    WEEKDAYS.forEach(function (w) { html += '<span>' + w + '</span>'; });
    html += '</div>';
    html += '<div class="calendar-grid">';
    for (var i = 0; i < firstDow; i++) html += '<div class="calendar-day is-empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var dateStr = year + "-" + pad2(month) + "-" + pad2(day);
      var count = countByDate[dateStr] || 0;
      var cls = "calendar-day";
      if (count > 0) cls += " has-sets";
      if (dateStr === today) cls += " is-today";
      if (dateStr === ui.calendarTapDate) cls += " is-selected";
      html += '<button class="' + cls + '" data-action="calendar-day-tap" data-date="' + dateStr + '"><span class="day-num">' + day + '</span></button>';
    }
    html += '</div>';
    var streak = computeStreak();
    html += '<div class="streak-line">' + (streak > 0 ? '現在 <b>' + streak + '日</b> 連続トレーニング中' : 'まだ連続記録はありません') + '</div>';
    var capDate = ui.calendarTapDate;
    var capCount = countByDate[capDate] || 0;
    html += '<div class="calendar-caption">' + formatDateLabel(capDate) + '：';
    if (capCount > 0) {
      var trainedParts = partsForDate(capDate);
      html += trainedParts.length ? escapeHtml(trainedParts.join("・")) : "（部位未設定の種目）";
    } else {
      html += "記録なし";
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function renderHistoryTab() {
    var html = '<div class="chip-row filter-row">';
    html += '<button class="chip' + (ui.historyViewMode !== "exercise" ? " is-selected" : "") + '" data-action="set-history-view" data-mode="date">日付別</button>';
    html += '<button class="chip' + (ui.historyViewMode === "exercise" ? " is-selected" : "") + '" data-action="set-history-view" data-mode="exercise">種目別</button>';
    html += '</div>';

    if (ui.historyViewMode === "exercise") {
      html += renderHistoryByExercise();
      return html;
    }

    return html + renderHistoryByDate();
  }

  function renderHistoryByExercise() {
    if (!state.exercises.length) {
      return '<div class="empty-state">まだ種目がありません。<br>「種目」タブから最初の種目を追加しましょう。</div>';
    }
    var byPart = {};
    state.exercises.forEach(function (ex) {
      var partKey = ex.part || "";
      (byPart[partKey] = byPart[partKey] || []).push(ex);
    });
    var partKeys = Object.keys(byPart).sort(function (a, b) {
      if (!a) return 1;
      if (!b) return -1;
      var ia = state.parts.indexOf(a); if (ia === -1) ia = 999;
      var ib = state.parts.indexOf(b); if (ib === -1) ib = 999;
      return ia - ib;
    });

    var html = '<section>';
    partKeys.forEach(function (partKey) {
      html += '<h2 class="section-title">' + escapeHtml(partKey || "未分類") + '</h2>';
      html += '<div class="ex-list">';
      byPart[partKey].forEach(function (ex) {
        var sets = state.sets.filter(function (s) { return s.exerciseId === ex.id; });
        var meta;
        if (sets.length) {
          var last = sets.slice().sort(function (a, b) { return b.ts - a.ts; })[0];
          meta = sets.length + 'セット・最終 ' + formatDateShort(last.date) + '（' + dispW(last.weight) + unitLabel() + '×' + last.reps + '回）';
        } else {
          meta = 'まだ記録がありません';
        }
        html += '<button class="ex-row" data-action="view-exercise-history" data-id="' + ex.id + '">';
        html += '<span><span class="ex-row-name">' + escapeHtml(ex.name) + '</span><div class="ex-row-meta">' + meta + '</div></span>';
        html += '<span class="ex-row-arrow">›</span>';
        html += '</button>';
      });
      html += '</div>';
    });
    html += '</section>';
    return html;
  }

  function renderHistoryByDate() {
    var calendarHtml = renderCalendarCard();
    if (!state.sets.length) {
      return calendarHtml + '<div class="empty-state">まだ記録がありません。<br>「記録」タブからセットを記録しましょう。</div>';
    }
    var byDate = {};
    state.sets.forEach(function (s) {
      (byDate[s.date] = byDate[s.date] || []).push(s);
    });
    var dates = Object.keys(byDate).sort().reverse();

    var html = calendarHtml;
    if (ui.calendarFilterActive) {
      html += '<button class="btn-text" data-action="calendar-show-all" style="align-self:flex-start;">‹ すべての記録を表示</button>';
      dates = dates.filter(function (d) { return d === ui.calendarTapDate; });
      if (!dates.length) {
        return html + '<div class="empty-state">' + formatDateLabel(ui.calendarTapDate) + 'の記録はありません。</div>';
      }
    }

    html += '<section>';
    dates.forEach(function (date, di) {
      var setsForDate = byDate[date];
      var byExercise = {};
      setsForDate.forEach(function (s) {
        (byExercise[s.exerciseId] = byExercise[s.exerciseId] || []).push(s);
      });
      var exIds = Object.keys(byExercise);

      var byPart = {};
      exIds.forEach(function (exId) {
        var ex = exerciseById(exId);
        var partKey = (ex && ex.part) ? ex.part : "";
        (byPart[partKey] = byPart[partKey] || []).push(exId);
      });
      var partKeys = Object.keys(byPart).sort(function (a, b) {
        if (!a) return 1;
        if (!b) return -1;
        var ia = state.parts.indexOf(a); if (ia === -1) ia = 999;
        var ib = state.parts.indexOf(b); if (ib === -1) ib = 999;
        return ia - ib;
      });

      html += '<div class="day-group">';
      html += '<div class="day-summary"><span>' + formatDateLabel(date) + '</span><span class="meta">' + exIds.length + '種目・' + setsForDate.length + 'セット</span></div>';
      html += '<div class="day-body">';
      partKeys.forEach(function (partKey) {
        if (partKey) html += '<details class="part-group" open><summary class="part-summary"><span class="part-label">' + escapeHtml(partKey) + '</span><span class="chev">›</span></summary><div class="part-body">';
        else html += '<div class="part-group part-group-plain"><div class="part-body">';
        byPart[partKey].forEach(function (exId) {
          var ex = exerciseById(exId);
          var sets = byExercise[exId].slice().sort(function (a, b) { return a.ts - b.ts; });
          html += '<div class="day-exercise-block">';
          html += '<div class="day-exercise-name">' + escapeHtml(ex ? ex.name : "削除済みの種目") + (!partKey && ex && ex.part ? '<span class="part-tag">' + escapeHtml(ex.part) + '</span>' : '') + '</div>';
          html += '<div class="day-chip-row">';
          sets.forEach(function (s) {
            html += '<span class="day-set-chip">' + dispW(s.weight) + unitLabel() + '×' + s.reps + '回<button data-action="delete-set" data-id="' + s.id + '">×</button></span>';
          });
          html += '</div>';
          var memoSets = sets.filter(function (s) { return s.memo; });
          if (memoSets.length) {
            html += '<div class="day-memo-list">';
            memoSets.forEach(function (s) {
              html += '<div class="day-memo-item">' + dispW(s.weight) + unitLabel() + '×' + s.reps + '回：' + escapeHtml(s.memo) + '</div>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        html += partKey ? '</div></details>' : '</div></div>';
      });
      html += '</div></div>';
    });
    html += '</section>';
    return html;
  }

  /* ---------------- render: stats tab ---------------- */

  function renderStatsTab() {
    var html = "";

    html += '<div class="chip-row">';
    html += '<button class="chip' + (ui.statsPeriod === "week" ? " is-selected" : "") + '" data-action="stats-set-period" data-period="week">週間</button>';
    html += '<button class="chip' + (ui.statsPeriod === "month" ? " is-selected" : "") + '" data-action="stats-set-period" data-period="month">月間</button>';
    html += '</div>';

    var range, label;
    if (ui.statsPeriod === "week") {
      range = weekRange(ui.statsAnchor);
      label = formatDateShort(range.start) + ' - ' + formatDateShort(range.end);
    } else {
      range = monthRange(ui.statsAnchor);
      label = monthLabel(range.ym);
    }

    var setsInRange = state.sets.filter(function (s) { return s.date >= range.start && s.date <= range.end; });
    var totalVolumeKg = setsInRange.reduce(function (sum, s) { return sum + s.weight * s.reps; }, 0);
    var daysSet = {};
    setsInRange.forEach(function (s) { daysSet[s.date] = true; });
    var workoutDays = Object.keys(daysSet).length;

    html += '<div class="calendar-card">';
    html += '<div class="calendar-head">';
    html += '<button class="calendar-nav-btn" data-action="stats-prev">‹</button>';
    html += '<span class="calendar-month-label">' + label + '</span>';
    html += '<button class="calendar-nav-btn" data-action="stats-next">›</button>';
    html += '</div>';
    html += '<div class="stat-row">';
    html += '<div class="stat-tile"><div class="stat-value">' + dispW(totalVolumeKg) + '</div><div class="stat-label">総ボリューム (' + unitLabel() + ')</div></div>';
    html += '<div class="stat-tile"><div class="stat-value">' + setsInRange.length + '</div><div class="stat-label">総セット数</div></div>';
    html += '<div class="stat-tile"><div class="stat-value">' + workoutDays + '</div><div class="stat-label">トレーニング日数</div></div>';
    html += '</div>';
    html += '</div>';

    if (!setsInRange.length) {
      html += '<div class="empty-state">この期間の記録はまだありません。</div>';
      return html;
    }

    var byPart = {};
    setsInRange.forEach(function (s) {
      var ex = exerciseById(s.exerciseId);
      var partKey = (ex && ex.part) ? ex.part : "";
      if (!byPart[partKey]) byPart[partKey] = { sets: 0, volume: 0 };
      byPart[partKey].sets += 1;
      byPart[partKey].volume += s.weight * s.reps;
    });
    var partKeys = Object.keys(byPart).sort(function (a, b) {
      if (!a) return 1;
      if (!b) return -1;
      var ia = state.parts.indexOf(a); if (ia === -1) ia = 999;
      var ib = state.parts.indexOf(b); if (ib === -1) ib = 999;
      return ia - ib;
    });
    var maxVolume = Math.max.apply(null, partKeys.map(function (k) { return byPart[k].volume; }));

    html += '<section>';
    html += '<h2 class="section-title">部位別ボリューム</h2>';
    html += '<div class="stat-bar-list">';
    partKeys.forEach(function (k) {
      var d = byPart[k];
      var pct = maxVolume > 0 ? Math.max(4, Math.round((d.volume / maxVolume) * 100)) : 0;
      html += '<div class="stat-bar-row">';
      html += '<div class="stat-bar-label">' + escapeHtml(k || "未分類") + '</div>';
      html += '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '<div class="stat-bar-value">' + dispW(d.volume) + unitLabel() + '<span class="stat-bar-sets">' + d.sets + 'セット</span></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</section>';

    return html;
  }

  function buildChartPoints(exId) {
    var sets = state.sets.filter(function (s) { return s.exerciseId === exId; });
    var byDate = {};
    sets.forEach(function (s) {
      if (!byDate[s.date] || s.weight > byDate[s.date].weight) byDate[s.date] = s;
    });
    return Object.keys(byDate).sort().map(function (d) {
      var s = byDate[d];
      return { date: s.date, reps: s.reps, weightKg: s.weight, weight: toDisplayWeight(s.weight) };
    });
  }

  function buildChartSVG(points, exId) {
    var W = 320, H = 132, padL = 30, padR = 14, padT = 14, padB = 22;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var weights = points.map(function (p) { return p.weight; });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if (min === max) { min -= 5; max += 5; }
    var margin = (max - min) * 0.18;
    min = Math.max(0, min - margin); max = max + margin;

    function xFor(i) { return points.length === 1 ? padL + innerW / 2 : padL + innerW * i / (points.length - 1); }
    function yFor(w) { return padT + innerH - ((w - min) / (max - min)) * innerH; }

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';

    for (var g = 0; g < 3; g++) {
      var gy = padT + (innerH * g / 2);
      svg += '<line class="chart-grid" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '"></line>';
    }

    var d = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + xFor(i).toFixed(1) + "," + yFor(p.weight).toFixed(1);
    }).join(" ");
    svg += '<path class="chart-line" d="' + d + '"></path>';

    points.forEach(function (p, i) {
      var isEnd = i === points.length - 1;
      var cx = xFor(i).toFixed(1), cy = yFor(p.weight).toFixed(1);
      svg += '<circle class="' + (isEnd ? "chart-dot-end" : "chart-dot") + '" cx="' + cx + '" cy="' + cy + '" r="' + (isEnd ? 5 : 3.5) + '"></circle>';
      svg += '<circle class="chart-hit" data-action="chart-point-tap" data-exid="' + exId + '" data-index="' + i + '" cx="' + cx + '" cy="' + cy + '" r="14"></circle>';
    });

    svg += '<text class="chart-axis-label" x="' + padL + '" y="' + (H - 6) + '" text-anchor="start">' + formatDateShort(points[0].date) + '</text>';
    svg += '<text class="chart-axis-label" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + formatDateShort(points[points.length - 1].date) + '</text>';
    svg += '</svg>';
    return svg;
  }

  function renderExerciseDetail(id) {
    var ex = exerciseById(id);
    if (!ex) { ui.exerciseDetailId = null; return renderExercisesTab(); }
    var sets = state.sets.filter(function (s) { return s.exerciseId === id; });

    var html = '<button class="detail-back" data-action="back-to-exercise-list">‹ 種目一覧</button>';
    html += '<div class="detail-title-row"><span class="detail-title">' + escapeHtml(ex.name) + '</span><button class="btn-text" data-action="open-rename-exercise" data-id="' + ex.id + '">名前を変更</button></div>';

    var maxWeight = 0, maxE1rm = 0;
    sets.forEach(function (s) {
      if (s.weight > maxWeight) maxWeight = s.weight;
      var e = e1rm(s.weight, s.reps);
      if (e > maxE1rm) maxE1rm = e;
    });

    html += '<div class="stat-row">';
    html += '<div class="stat-tile"><div class="stat-value">' + (sets.length ? dispW(maxWeight) : "—") + '</div><div class="stat-label">自己ベスト (' + unitLabel() + ')</div></div>';
    html += '<div class="stat-tile"><div class="stat-value">' + (sets.length ? dispW(maxE1rm) : "—") + '</div><div class="stat-label">推定1RM (' + unitLabel() + ')</div></div>';
    html += '<div class="stat-tile"><div class="stat-value">' + sets.length + '</div><div class="stat-label">総セット数</div></div>';
    html += '</div>';

    var points = buildChartPoints(id);
    html += '<div class="chart-card">';
    if (points.length >= 2) {
      html += buildChartSVG(points, id);
      var tIdx = ui.chartTooltipIndex[id];
      var shown = (typeof tIdx === "number" && points[tIdx]) ? points[tIdx] : points[points.length - 1];
      html += '<div class="chart-caption">' + formatDateLabel(shown.date) + '　<b>' + dispW(shown.weightKg) + unitLabel() + ' × ' + shown.reps + '回</b>　(e1RM ' + dispW(e1rm(shown.weightKg, shown.reps)) + unitLabel() + ')</div>';
    } else {
      html += '<div class="empty-state" style="border:none;padding:18px 8px;">記録が2日分以上になると、重量の推移グラフが表示されます。</div>';
    }
    html += '</div>';

    html += '<section>';
    html += '<h2 class="section-title">全記録</h2>';
    if (sets.length) {
      var sorted = sets.slice().sort(function (a, b) { return b.ts - a.ts; });
      html += '<div class="set-list">';
      sorted.forEach(function (s) {
        var isPR = maxE1rm > 0 && e1rm(s.weight, s.reps) === maxE1rm;
        html += '<div class="set-row">';
        html += '<div class="set-row-main">';
        html += '<span class="set-row-idx" style="width:auto;font-size:0.7rem;">' + formatDateShort(s.date) + '</span>';
        html += '<span class="set-row-figure">' + dispW(s.weight) + unitLabel() + '<span class="x">×</span>' + s.reps + '<span class="x">回</span>' + (isPR ? '<span class="pr-badge">PR</span>' : '') + '</span>';
        html += '<span class="set-row-e1rm">e1RM ' + dispW(e1rm(s.weight, s.reps)) + '</span>';
        html += '<button class="set-row-del" data-action="delete-set" data-id="' + s.id + '">×</button>';
        html += '</div>';
        if (s.memo) html += '<div class="set-row-memo">' + escapeHtml(s.memo) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-state">まだこの種目の記録はありません。</div>';
    }
    html += '</section>';

    html += '<button class="btn-danger" data-action="open-delete-exercise" data-id="' + ex.id + '">この種目を削除</button>';
    return html;
  }

      html += '<div class="modal-actions"><button class="btn-secondary" data-action="modal-cancel">キャンセル</button><button class="btn-danger" data-action="modal-confirm-import">復元する</button></div>';

  /* ---------------- master render ---------------- */

  function render() {
    document.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-tab") === ui.tab);
    });
    var view = document.getElementById("view");
    if (ui.tab === "log") view.innerHTML = renderLogTab();
    else if (ui.tab === "history") view.innerHTML = renderHistoryTab();
    else if (ui.tab === "stats") view.innerHTML = renderStatsTab();
    else view.innerHTML = renderExercisesTab();
    renderModal();
  }

  /* ---------------- backup download ---------------- */

  function downloadViaBlob(filename, text) {
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) { /* download not supported in this context */ }
  }

  function downloadBackup() {
    var filename = "torelog-backup-" + todayStr() + ".json";
    var text = JSON.stringify(state, null, 2);
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (downloads) {
        if (!downloads) { downloadViaBlob(filename, text); return; }
        downloads.save({ filename: filename, data: text }).then(function () {
          showToast("ダウンロードしました");
        }).catch(function (err) {
          if (err && err.code === "declined") return;
          showToast("ダウンロードできませんでした。下のテキストをコピーしてください");
        });
      }).catch(function () { downloadViaBlob(filename, text); });
    } else {
      downloadViaBlob(filename, text);
    }
  }

  /* ---------------- actions ---------------- */

  function handleAction(action, target, ev) {
    var id = target.getAttribute("data-id");
    if (action === "select-tab") {
      ui.tab = target.getAttribute("data-tab");
      ui.exerciseDetailId = null;
      render();
    } else if (action === "select-exercise") {
      ui.selectedExerciseId = id;
      primeEntryFromHistory(id);
      render();
    } else if (action === "set-history-view") {
      ui.historyViewMode = target.getAttribute("data-mode");
      render();
    } else if (action === "view-exercise-history") {
      ui.tab = "exercises";
      ui.exerciseDetailId = id;
      render();
    } else if (action === "stats-set-period") {
      ui.statsPeriod = target.getAttribute("data-period");
      render();
    } else if (action === "stats-prev") {
      ui.statsAnchor = ui.statsPeriod === "week" ? addDays(ui.statsAnchor, -7) : shiftMonth(ui.statsAnchor.slice(0, 7), -1) + "-01";
      render();
    } else if (action === "stats-next") {
      ui.statsAnchor = ui.statsPeriod === "week" ? addDays(ui.statsAnchor, 7) : shiftMonth(ui.statsAnchor.slice(0, 7), 1) + "-01";
      render();
    } else if (action === "date-prev") {
      ui.selectedDate = addDays(ui.selectedDate, -1);
      ui.entryMemo = "";
      render();
    } else if (action === "date-next") {
      if (ui.selectedDate !== todayStr()) ui.selectedDate = addDays(ui.selectedDate, 1);
      ui.entryMemo = "";
      render();
    } else if (action === "stepper") {
      var t = target.getAttribute("data-target");
      var delta = parseFloat(target.getAttribute("data-delta"));
      if (t === "weight") {
        ui.entryWeight = Math.max(0, Math.round((ui.entryWeight + delta) * 100) / 100);
        var wi = document.getElementById("weight-input");
        if (wi) wi.value = fmtWeight(ui.entryWeight);
      } else {
        ui.entryReps = Math.max(1, ui.entryReps + delta);
        var ri = document.getElementById("reps-input");
        if (ri) ri.value = ui.entryReps;
      }
      updateEntryPreview();
    } else if (action === "log-set") {
      if (!ui.selectedExerciseId) return;
      if (!(ui.entryWeight >= 0) || !(ui.entryReps >= 1)) return;
      var newWeightKg = toStorageWeight(ui.entryWeight);
      var newReps = Math.round(ui.entryReps);
      var priorForEx = state.sets.filter(function (s) { return s.exerciseId === ui.selectedExerciseId; });
      var prevMaxE1rm = priorForEx.length ? Math.max.apply(null, priorForEx.map(function (s) { return e1rm(s.weight, s.reps); })) : null;
      var newE1rm = e1rm(newWeightKg, newReps);
      state.sets.push({
        id: uid("set"),
        exerciseId: ui.selectedExerciseId,
        weight: newWeightKg,
        reps: newReps,
        date: ui.selectedDate,
        memo: (ui.entryMemo || "").trim(),
        ts: Date.now()
      });
      saveState();
      ui.entryMemo = "";
      ui.logFlash = true;
      if (prevMaxE1rm !== null && newE1rm > prevMaxE1rm) showToast("自己ベスト更新！ " + dispW(newWeightKg) + unitLabel() + '×' + newReps + '回');
      else showToast("記録しました");
      render();
    } else if (action === "delete-set") {
      ui.modal = { type: "confirmDeleteSet", id: id };
      renderModal();
    } else if (action === "modal-confirm-delete-set") {
      state.sets = state.sets.filter(function (s) { return s.id !== id; });
      saveState();
      ui.modal = null;
      render();
    } else if (action === "open-exercise-detail") {
      ui.exerciseDetailId = id;
      render();
    } else if (action === "back-to-exercise-list") {
      ui.exerciseDetailId = null;
      render();
    } else if (action === "open-add-exercise") {
      ui.modalPart = "";
      ui.modal = { type: "addExercise" };
      renderModal();
    } else if (action === "modal-submit-add-exercise") {
      var input = document.getElementById("modal-input");
      var name = input ? input.value.trim() : "";
      if (!name) return;
      var newEx = { id: uid("ex"), name: name, part: ui.modalPart || "", addedAt: Date.now() };
      state.exercises.push(newEx);
      saveState();
      ui.selectedExerciseId = newEx.id;
      primeEntryFromHistory(newEx.id);
      ui.modal = null;
      render();
    } else if (action === "open-rename-exercise") {
      var exForRename = exerciseById(id);
      ui.modalPart = (exForRename && exForRename.part) || "";
      ui.modal = { type: "renameExercise", id: id };
      renderModal();
    } else if (action === "modal-submit-rename-exercise") {
      var input2 = document.getElementById("modal-input");
      var name2 = input2 ? input2.value.trim() : "";
      var exToRename = exerciseById(id);
      if (!name2 || !exToRename) return;
      exToRename.name = name2;
      exToRename.part = ui.modalPart || "";
      saveState();
      ui.modal = null;
      render();
    } else if (action === "modal-pick-part") {
      var pickedPart = target.getAttribute("data-part");
      ui.modalPart = (ui.modalPart === pickedPart) ? "" : pickedPart;
      renderModal();
    } else if (action === "open-delete-exercise") {
      ui.modal = { type: "confirmDeleteExercise", id: id };
      renderModal();
    } else if (action === "modal-confirm-delete-exercise") {
      state.exercises = state.exercises.filter(function (e) { return e.id !== id; });
      state.sets = state.sets.filter(function (s) { return s.exerciseId !== id; });
      saveState();
      if (ui.selectedExerciseId === id) ui.selectedExerciseId = state.exercises[0] ? state.exercises[0].id : null;
      ui.exerciseDetailId = null;
      ui.modal = null;
      render();
    } else if (action === "modal-cancel" || action === "modal-overlay") {
      ui.modal = null;
      renderModal();
    } else if (action === "toggle-stopwatch") {
      toggleStopwatch();
    } else if (action === "reset-stopwatch") {
      resetStopwatch();
    } else if (action === "rest-toggle") {
      unlockAudio();
      if (ui.restTimer.running) pauseRestTimer();
      else startRestTimer();
      render();
    } else if (action === "rest-adjust") {
      adjustRestTimer(parseInt(target.getAttribute("data-delta"), 10));
      render();
    } else if (action === "rest-preset") {
      setRestPreset(parseInt(target.getAttribute("data-sec"), 10));
      render();
    } else if (action === "rest-reset") {
      resetRestTimer();
      render();
    } else if (action === "toggle-sound") {
      toggleSound();
      render();
    } else if (action === "set-log-filter") {
      ui.logFilterPart = target.getAttribute("data-part") || null;
      var visible = ui.logFilterPart ? state.exercises.filter(function (ex) { return ex.part === ui.logFilterPart; }) : state.exercises;
      var stillVisible = visible.some(function (ex) { return ex.id === ui.selectedExerciseId; });
      if (!stillVisible) {
        ui.selectedExerciseId = visible[0] ? visible[0].id : null;
        if (ui.selectedExerciseId) primeEntryFromHistory(ui.selectedExerciseId);
      }
      render();
    } else if (action === "set-unit") {
      var newUnit = target.getAttribute("data-unit");
      if (newUnit !== state.settings.unit) {
        state.settings.unit = newUnit;
        state.settings.weightStep = newUnit === "lb" ? 5 : 2.5;
        saveState();
        if (ui.selectedExerciseId) primeEntryFromHistory(ui.selectedExerciseId);
      }
      render();
    } else if (action === "set-weight-step") {
      state.settings.weightStep = parseFloat(target.getAttribute("data-step"));
      saveState();
      render();
    } else if (action === "add-part") {
      var newPartInput = document.getElementById("new-part-input");
      var newPartName = newPartInput ? newPartInput.value.trim() : "";
      if (!newPartName) return;
      if (state.parts.indexOf(newPartName) === -1) {
        state.parts.push(newPartName);
        saveState();
      }
      render();
    } else if (action === "delete-part-request") {
      ui.modal = { type: "confirmDeletePart", part: target.getAttribute("data-part") };
      renderModal();
    } else if (action === "modal-confirm-delete-part") {
      var partToDelete = target.getAttribute("data-part");
      state.parts = state.parts.filter(function (p) { return p !== partToDelete; });
      state.exercises.forEach(function (ex) { if (ex.part === partToDelete) ex.part = ""; });
      if (ui.logFilterPart === partToDelete) ui.logFilterPart = null;
      saveState();
      ui.modal = null;
      render();
    } else if (action === "calendar-prev") {
      ui.calendarMonth = shiftMonth(ui.calendarMonth, -1);
      render();
    } else if (action === "calendar-next") {
      ui.calendarMonth = shiftMonth(ui.calendarMonth, 1);
      render();
    } else if (action === "open-month-picker") {
      ui.modal = { type: "calendarMonthPicker" };
      renderModal();
    } else if (action === "modal-goto-month") {
      var pickY = document.getElementById("picker-year");
      var pickM = document.getElementById("picker-month");
      if (pickY && pickM) ui.calendarMonth = pickY.value + "-" + pad2(parseInt(pickM.value, 10));
      ui.modal = null;
      render();
    } else if (action === "calendar-day-tap") {
      ui.calendarTapDate = target.getAttribute("data-date");
      ui.calendarFilterActive = true;
      render();
    } else if (action === "calendar-show-all") {
      ui.calendarFilterActive = false;
      render();
    } else if (action === "export-download") {
      downloadBackup();
    } else if (action === "export-copy") {
      var exportText = JSON.stringify(state, null, 2);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(exportText).then(function () {
          showToast("コピーしました");
        }).catch(function () {
          showToast("コピーできませんでした。下のテキストを選択してコピーしてください");
        });
      } else {
        showToast("下のテキストを選択してコピーしてください");
      }
    } else if (action === "modal-confirm-import") {
      var imported = ui.modal && ui.modal.data;
      if (imported) {
        state = migrateState(imported);
        state.stopwatch.running = false;
        state.stopwatch.startedAt = null;
        saveState();
        ui.selectedExerciseId = state.exercises[0] ? state.exercises[0].id : null;
        if (ui.selectedExerciseId) primeEntryFromHistory(ui.selectedExerciseId);
        ui.exerciseDetailId = null;
        ui.logFilterPart = null;
        updateStopwatchDisplay();
        maybeStopTicking();
        showToast("データを復元しました");
      }
      ui.modal = null;
      render();
    } else if (action === "chart-point-tap") {
      var exid = target.getAttribute("data-exid");
      ui.chartTooltipIndex[exid] = parseInt(target.getAttribute("data-index"), 10);
      render();
    }
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    unlockAudio();
    var action = el.getAttribute("data-action");
    if (action === "modal-overlay" && e.target !== el) return; // click landed inside the sheet, not the backdrop
    handleAction(action, el, e);
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "weight-input") {
      var v = parseFloat(e.target.value);
      ui.entryWeight = isNaN(v) ? 0 : Math.max(0, v);
      updateEntryPreview();
    } else if (e.target.id === "reps-input") {
      var v2 = parseInt(e.target.value, 10);
      ui.entryReps = isNaN(v2) ? 1 : Math.max(1, v2);
      updateEntryPreview();
    } else if (e.target.id === "memo-input") {
      ui.entryMemo = e.target.value;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "import-file-input") {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.sets)) throw new Error("invalid");
          ui.modal = { type: "confirmImport", data: parsed };
          renderModal();
        } catch (err) {
          ui.modal = { type: "importError" };
          renderModal();
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) tick();
  });

  updateStopwatchDisplay();
  if (state.stopwatch.running) ensureTicking();
  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>

</body></html>
